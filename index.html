<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>我的导航</title>
<meta name="description" content="常用站点 · 分类整理">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f9d6b'/%3E%3Cpath d='M11 8.5h10A1.5 1.5 0 0 1 22.5 10v14.2L16 19.9l-6.5 4.3V10A1.5 1.5 0 0 1 11 8.5z' fill='%23fff'/%3E%3C/svg%3E">
<script>
  /* 先定主题再渲染，避免首屏白闪 */
  (function () {
    var meta = document.querySelector('meta[name="theme-color"]');
    try {
      var t = localStorage.getItem('nav-theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (meta) meta.setAttribute('content', t === 'dark' ? '#14171b' : '#f6f7f9');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
  :root {
    --bg: #f6f7f9;
    --elv: #ffffff;
    --soft: #f0f2f5;
    --border: #e6e8ec;
    --text1: #1b1f24;
    --text2: #5f6875;
    --brand: #0f9d6b;
    --brand-soft: #e9f7f1;
    --brand-text: #0b7d56;
    --mark: rgba(250, 204, 21, .38);
    --star: #b45309;
    --grid-line: rgba(15, 157, 107, .07);
    --shadow: 0 6px 18px rgba(17, 24, 39, .08);
    --radius: 8px;
    --side: 200px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #14171b;
    --elv: #1b1f25;
    --soft: #23282f;
    --border: #2b313a;
    --text1: #e7eaee;
    --text2: #98a2b0;
    --brand: #34d399;
    --brand-soft: rgba(52, 211, 153, .10);
    --brand-text: #6ee7b7;
    --mark: rgba(250, 204, 21, .26);
    --star: #fbbf24;
    --grid-line: rgba(110, 231, 183, .045);
    --shadow: 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- 外壳 ---------- */
  .app {
    display: grid;
    grid-template-columns: var(--side) minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- 左栏 ---------- */
  .side {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 12px 16px;
    background: var(--elv);
    border-right: 1px solid var(--border);
  }
  .brand { display: flex; align-items: flex-start; gap: 9px; padding: 0 4px; }
  .brand-txt { min-width: 0; flex: 1; }
  .brand-txt b { display: block; font-size: 15px; font-weight: 650; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-txt small { display: block; margin-top: 1px; font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .theme-btn {
    width: 28px; height: 28px; flex: none;
    margin-top: -1px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .theme-btn:hover { background: var(--soft); color: var(--text1); border-color: var(--text2); }
  .theme-btn svg { width: 15px; height: 15px; }
  [data-theme="light"] .i-moon { display: none; }
  [data-theme="dark"] .i-sun { display: none; }

  .search { position: relative; }
  .search svg {
    position: absolute; left: 9px; top: 50%;
    width: 15px; height: 15px;
    transform: translateY(-50%);
    color: var(--text2); pointer-events: none;
  }
  .search input {
    width: 100%; height: 34px;
    padding: 0 30px 0 30px;
    font: inherit; font-size: 13px;
    color: var(--text1);
    background: var(--soft);
    border: 1px solid transparent;
    border-radius: 8px;
    outline: none;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--text2); }
  .search input:focus {
    background: var(--elv);
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  .search kbd {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    padding: 1px 5px;
    font-family: inherit; font-size: 10px; line-height: 1.4;
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--elv);
    pointer-events: none;
  }
  .search input:focus + kbd { opacity: 0; }

  .dir {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0 -4px;
    padding: 2px 4px;
    scrollbar-width: thin;
  }
  .dir::-webkit-scrollbar { width: 6px; }
  .dir::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .dir::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  .dir-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    padding: 7px 10px;
    background: transparent;
    border: 0;
    border-radius: 7px;
    color: var(--text2);
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .dir-item:hover { background: var(--soft); color: var(--text1); }
  .dir-item .dot {
    width: 5px; height: 5px; flex: none;
    border-radius: 50%;
    background: currentColor;
    opacity: .35;
    transition: opacity .15s, transform .15s;
  }
  .dir-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dir-item .count {
    flex: none;
    color: var(--text2);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    opacity: .78;
  }
  .dir-item.active {
    background: var(--brand-soft);
    color: var(--brand-text);
    font-weight: 600;
    box-shadow: inset 2px 0 0 var(--brand);
  }
  .dir-item.active .dot { opacity: 1; transform: scale(1.35); }
  .dir-item.active .count { color: currentColor; opacity: .82; }
  .quick-item .dot { background: var(--brand); }

  /* ---------- 主体 ---------- */
  .main {
    min-width: 0;
    padding: 22px clamp(18px, 3vw, 40px) 80px;
    background-image:
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(180deg, var(--grid-line) 1px, transparent 1px);
    background-size: 20px 20px;
    background-position: center;
    background-attachment: fixed;
  }

  .group { scroll-margin-top: 8px; }
  .group + .group {
    margin-top: 44px;
    padding-top: 26px;
    border-top: 1px solid var(--border);
  }
  .group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .group-head h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.2px;
  }
  .group-head .meta { font-size: 12.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .quick-clear {
    margin-left: auto;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--elv);
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
  }
  .quick-clear:hover { color: var(--text1); border-color: var(--text2); }
  .search-more {
    display: block;
    margin: 16px auto 0;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--elv);
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
  }
  .search-more:hover { color: var(--text1); border-color: var(--text2); }

  /* tab 条在所属区块内吸顶 */
  .tabbar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin-top: 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    transition: box-shadow .2s;
  }
  .tabbar.stuck { box-shadow: 0 6px 14px -10px rgba(0, 0, 0, .5); }
  .tabs {
    display: flex; gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs.fade-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); }
  .tabs.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
  .tabs.fade-l.fade-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }

  .tab {
    position: relative;
    padding: 9px 12px 10px;
    background: transparent;
    border: 0;
    border-radius: 6px 6px 0 0;
    color: var(--text2);
    font-size: 13.5px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .tab:hover { color: var(--text1); background: var(--soft); }
  .tab[aria-selected="true"] { color: var(--brand-text); font-weight: 600; }
  .tab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 10px; right: 10px; bottom: -1px;
    height: 2px;
    border-radius: 2px;
    background: var(--brand);
  }

  /* ---------- 卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  @media (min-width: 1440px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  }

  .card {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr);
    align-items: start;
    column-gap: 10px;
    min-width: 0;
    padding: 10px 12px 9px;
    background: var(--elv);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    transition: background .2s, border-color .2s, box-shadow .2s, transform .2s;
  }
  .card-shell { position: relative; min-width: 0; }
  .card-shell .card { height: 100%; }
  .fav-btn {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text2);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }
  .fav-btn:hover { color: var(--brand-text); background: var(--soft); }
  .fav-btn[aria-pressed="true"] { color: var(--star); }
  .fav-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .card:hover {
    background: var(--brand-soft);
    border-color: var(--brand);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .card:active { transform: translateY(0); }
  .card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .ico {
    position: relative;
    width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    background: var(--soft);
    overflow: hidden;
  }
  /* 字母色块先占位，图标加载成功后再盖上去，避免破图与闪烁 */
  .ico .letter {
    display: flex;
    align-items: center; justify-content: center;
    width: 100%; height: 100%;
    font-size: 15px; font-weight: 700;
    color: hsl(var(--h, 160) 45% 32%);
    background: hsl(var(--h, 160) 65% 90%);
  }
  .ico img {
    position: absolute; inset: 0; margin: auto;
    width: 22px; height: 22px;
    object-fit: contain;
    border-radius: 3px;
    background: var(--soft);
    opacity: 0;
    transition: opacity .18s;
  }
  .ico img.on { opacity: 1; }
  [data-theme="dark"] .ico .letter {
    color: hsl(var(--h, 160) 60% 80%);
    background: hsl(var(--h, 160) 30% 26%);
  }

  .card-copy {
    min-width: 0;
    padding-right: 30px;
  }

  .card-title {
    display: block;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card:hover .card-title { color: var(--brand-text); }

  .card-desc {
    display: block;
    font-size: 12px;
    line-height: 1.25;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-path {
    margin-top: 4px;
    display: flex; align-items: center; gap: 5px;
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-path i { font-style: normal; opacity: .5; }

  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  .empty {
    margin: 40px 0;
    text-align: center;
    color: var(--text2);
    font-size: 13px;
  }
  .empty b { display: block; font-size: 15px; color: var(--text1); margin-bottom: 4px; font-weight: 600; }

  /* 键盘用户跳过左栏 */
  .skip {
    position: fixed;
    left: 8px; top: -48px;
    z-index: 50;
    padding: 8px 12px;
    background: var(--elv);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text1);
    font-size: 13px;
    text-decoration: none;
    transition: top .15s;
  }
  .skip:focus { top: 8px; }
  .main:focus { outline: none; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side, .main { min-width: 0; }
    .side {
      position: sticky;
      top: 0;
      z-index: 20;
      height: auto;
      gap: 9px;
      padding: 10px 12px 6px;
      border-right: 0;
      border-bottom: 1px solid var(--border);
    }
    .dir {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 6px;
      margin: 0;
      padding: 2px 0 4px;
    }
    .dir::-webkit-scrollbar { display: none; }
    .dir-item {
      width: auto;
      padding: 6px 12px;
      background: var(--soft);
      border-radius: 999px;
    }
    .dir-item.active { box-shadow: none; }
    .dir-item .dot { display: none; }
    .main { padding: 16px 14px 56px; }
    .group + .group { margin-top: 34px; padding-top: 20px; }
    .group-head h2 { font-size: 18px; }
    .tabbar { position: static; margin-top: 6px; }
    .tabbar.stuck { box-shadow: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
    .card {
      grid-template-columns: 30px minmax(0, 1fr);
      padding: 9px 10px 8px;
      column-gap: 9px;
    }
    .ico { width: 30px; height: 30px; }
    .ico img { width: 20px; height: 20px; }
    .card-title { font-size: 13.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<button class="skip" type="button" id="skip">跳到内容</button>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-txt">
        <b id="siteName">我的导航</b>
        <small id="siteDesc"></small>
      </span>
      <button class="theme-btn" id="theme" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="search" placeholder="搜索站点、描述、域名" autocomplete="off" spellcheck="false" aria-label="搜索站点">
      <kbd>/</kbd>
    </div>

    <nav class="dir" id="dir" aria-label="分类目录">
      <button class="dir-item quick-item" id="favoriteItem" type="button">
        <span class="dot"></span>
        <span class="name">常用收藏</span>
        <span class="num" id="favoriteNum">0</span>
      </button>
      <button class="dir-item quick-item" id="recentItem" type="button">
        <span class="dot"></span>
        <span class="name">最近访问</span>
        <span class="num" id="recentNum">0</span>
      </button>
    </nav>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div id="groups"></div>

    <div id="searchView" hidden>
      <div class="group-head">
        <h2>搜索结果</h2>
        <span class="meta" id="searchMeta" aria-live="polite"></span>
      </div>
      <div class="grid" id="searchGrid"></div>
      <button class="search-more" id="searchMore" type="button" hidden>继续显示</button>
      <div class="empty" id="searchEmpty" hidden></div>
    </div>

    <div id="quickView" hidden>
      <div class="group-head">
        <h2 id="quickTitle" tabindex="-1"></h2>
        <span class="meta" id="quickMeta" aria-live="polite"></span>
        <button class="quick-clear" id="quickClear" type="button">清空</button>
      </div>
      <div class="grid" id="quickGrid"></div>
      <div class="empty" id="quickEmpty" hidden></div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  /* 图标只把域名交给第三方；失败后尝试站点 favicon，再回退成首字母色块 */
  var ICON_PROVIDER = 'https://ico.n3v.cn/get.php?url=';

  var root = document.documentElement;
  var NAV = window.NAV || [];
  var SITE = window.SITE || {};
  var dirEl = document.getElementById('dir');
  var groupsEl = document.getElementById('groups');
  var searchView = document.getElementById('searchView');
  var searchGrid = document.getElementById('searchGrid');
  var searchMeta = document.getElementById('searchMeta');
  var searchEmpty = document.getElementById('searchEmpty');
  var searchMore = document.getElementById('searchMore');
  var favoriteItem = document.getElementById('favoriteItem');
  var favoriteNum = document.getElementById('favoriteNum');
  var recentItem = document.getElementById('recentItem');
  var recentNum = document.getElementById('recentNum');
  var quickView = document.getElementById('quickView');
  var quickTitle = document.getElementById('quickTitle');
  var quickMeta = document.getElementById('quickMeta');
  var quickGrid = document.getElementById('quickGrid');
  var quickEmpty = document.getElementById('quickEmpty');
  var quickClear = document.getElementById('quickClear');
  var qEl = document.getElementById('q');
  var mainEl = document.getElementById('main');
  var skipBtn = document.getElementById('skip');

  var motionQuery = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduceMotion = !!(motionQuery && motionQuery.matches);
  if (motionQuery) {
    var onMotion = function (ev) { reduceMotion = ev.matches; };
    if (motionQuery.addEventListener) motionQuery.addEventListener('change', onMotion);
    else if (motionQuery.addListener) motionQuery.addListener(onMotion);
  }

  var state = { active: 0, tabs: [], q: '', quick: '', savedY: 0 };
  var dirItems = [];
  var sections = [];
  var tabBtns = [];
  var grids = [];
  var tabbars = [];
  var panels = [];
  var spyLockUntil = 0;
  var spyTimer = 0;
  var skipHash = false;
  var canReplace = true;
  var STORE_FAVORITES = 'nav-favorites';
  var STORE_RECENTS = 'nav-recents';
  var STORE_ICON_FAILS = 'nav-icon-fail';
  var ICON_FAIL_TTL = 7 * 24 * 60 * 60 * 1000;
  var favorites = loadList(STORE_FAVORITES);
  var favoriteSet = new Set(favorites);
  var recents = loadList(STORE_RECENTS);
  var iconFails = loadIconFails();
  var catalog = {};
  var searchIndex = [];
  var renderedTabs = [];
  var groupObserver = null;
  var iconObserver = null;
  var URL_ALIASES = window.URL_ALIASES || {};

  try { history.replaceState(null, '', location.href); } catch (e) { canReplace = false; }

  /* ---------- 工具函数 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)

            group: g.name,
            section: s.name,

  function syncFavoriteButtons(key) {
    var entry = catalog[key];

    var on = favoriteSet.has(key);

  function syncAllFavoriteButtons() {
    var btns = document.querySelectorAll('.fav-btn');
    for (var i = 0; i < btns.length; i++) {
      var key = btns[i].dataset.url;
      var entry = catalog[key];
      updateFavButton(btns[i], favoriteSet.has(key), entry && entry.item ? entry.item.name : '');

    if (removing) favoriteSet.delete(key);
    else if (catalog[key]) favoriteSet.add(key);

    updateQuickCounts();

    if (state.quick === 'favorites' && removing) {
      /* 收藏视图里取消收藏要移除卡片，按原位置把焦点交给下一条 */
      var all = quickGrid.querySelectorAll('.fav-btn');
      var pos = Array.prototype.indexOf.call(all, btn);
      syncFavoriteButtons(key);
      renderQuick();
      var next = quickGrid.querySelectorAll('.fav-btn');

  /* ---------- 卡片 ---------- */
  function cardHTML(item, path) {
    var desc = item.desc ? '<span class="card-desc">' + hl(item.desc, state.q) + '</span>' : '';
    var meta = path ? '<span class="card-path">' + esc(path[0]) + '<i>/</i>' + esc(path[1]) + '</span>' : '';

    var fallback = siteFavicon(item);

      + '<span class="ico"><span class="letter" aria-hidden="true" style="--h:' + hue(item.name) + '">' + esc(firstChar(item.name)) + '</span>'

      + '<span class="card-copy">'

  /* ---------- 构建整页 ---------- */
  function groupHTML(g, gi) {

  function build() {

    tabbars = sections.map(function (sec) { return sec.querySelector('.tabbar'); });
    panels = sections.map(function (sec) { return sec.querySelector('.panel'); });
    state.tabs = NAV.map(function () { return 0; });
    renderedTabs = NAV.map(function () { return {}; });

  function quickEntries(kind) {

  function renderQuick() {

  /* ---------- 左栏高亮 / 滚动联动 ---------- */

  function updateSpy(force) {

    syncHash();
  }

  /* ---------- 切换 tab ---------- */
  function selectTab(gi, ti, keepPosition) {
    var g = NAV[gi];

  function scrollTabIntoView(gi, instant) {

    var left = btn.offsetLeft;
    var right = left + btn.offsetWidth;

        var prev = wrap.style.scrollBehavior;
        wrap.style.scrollBehavior = 'auto';
        wrap.scrollLeft = target;
        wrap.style.scrollBehavior = prev;

  }
  function updateFadeAll() {
    tabBtns.forEach(function (btns) {
      if (btns[0]) updateFade(btns[0].parentNode);
    });
  }

  function observeTabs(gi) {
    var wrap = tabBtns[gi][0] && tabBtns[gi][0].parentNode;
    if (!wrap) return;
    wrap.addEventListener('scroll', function () { updateFade(wrap); }, { passive: true });
  }

  groupsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    var gi = Number(btn.dataset.g);
    var ti = Number(btn.dataset.t);
    setActive(gi);
    selectTab(gi, ti, true);
    spyLockUntil = performance.now() + 600;
    syncHash();
  });

  /* tablist 内用方向键切换，焦点跟随；阻止冒泡避免和全局左右键重复触发 */
  groupsEl.addEventListener('keydown', function (e) {
    if (composing || e.isComposing) return;
    var tab = e.target.closest('.tab');
    if (!tab) return;
    var gi = Number(tab.dataset.g);
    var list = tabBtns[gi];
    if (!list || !list.length) return;
    var ti = state.tabs[gi];
    var next = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (ti + 1) % list.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (ti - 1 + list.length) % list.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = list.length - 1;
    if (next < 0) return;
    e.preventDefault();
    e.stopPropagation();
    setActive(gi);
    selectTab(gi, next, true);
    list[next].focus();
    spyLockUntil = performance.now() + 600;
  });

  if (skipBtn && mainEl) {
    skipBtn.addEventListener('click', function () {
      mainEl.focus({ preventScroll: true });
      mainEl.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
    });
  }

  mainEl.addEventListener('click', function (e) {
    var favorite = e.target.closest('.fav-btn');
    if (favorite) {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(favorite.dataset.url, favorite);
      return;
    }
    var card = e.target.closest('.card[data-url]');
    if (card) recordRecent(card.dataset.url);
  });

  quickClear.addEventListener('click', function () {
    var clearedFavorites = state.quick === 'favorites';
    if (clearedFavorites) {
      favorites = [];
      favoriteSet.clear();
      saveList(STORE_FAVORITES, favorites);
    } else if (state.quick === 'recents') {
      recents = [];
      saveList(STORE_RECENTS, recents);
    }
    updateQuickCounts();
    /* 清空收藏后，主网格/搜索结果里的星标也要同步变回空心 */
    if (clearedFavorites) syncAllFavoriteButtons();
    renderQuick();
    quickTitle.focus({ preventScroll: true });
  });

  /* ---------- 滚动监听 ---------- */
  var lastSpy = 0;
  window.addEventListener('scroll', function () {
    var now = performance.now();
    if (now - lastSpy < 40) return;
    lastSpy = now;
    updateSpy();
  }, { passive: true });

  window.addEventListener('resize', function () {
    updateFadeAll();
    markStuck();
  });

  /* ---------- 搜索 ---------- */
  function searchAll(q) {
    var terms = searchTerms(q), out = [];
    if (!terms.length) return out;
    for (var i = 0; i < searchIndex.length; i++) {
      var row = searchIndex[i];
      var score = 0, matched = true;
      for (var t = 0; t < terms.length; t++) {
        var k = terms[t], termScore = 0;
        if (row.name === k) termScore = 12;
        else if (row.name.indexOf(k) === 0) termScore = 10;
        else if (row.name.indexOf(k) >= 0) termScore = 8;
        else if (row.keywords.indexOf(k) >= 0) termScore = 7;
        else if (row.sectionText.indexOf(k) >= 0) termScore = 5;
        else if (row.groupText.indexOf(k) >= 0) termScore = 4;
        else if (row.url.indexOf(k) >= 0) termScore = 3;
        else if (row.desc.indexOf(k) >= 0) termScore = 2;
        if (!termScore) { matched = false; break; }
        score += termScore;
      }
      if (matched) out.push({ item: row.item, group: row.group, section: row.section, score: score });
    }
    out.sort(function (a, b) { return b.score - a.score || a.item.name.localeCompare(b.item.name, 'zh-CN'); });
    return out;
  }

  var searchTimer = 0;
  var composing = false;
  var composingEndAt = 0;
  var lastSearchKey = '';
  var searchHits = [];
  var SEARCH_PAGE_SIZE = 100;
  var searchLimit = SEARCH_PAGE_SIZE;

  function enterSearch() {
    if (!searchView.hidden) return;
    if (!state.quick) state.savedY = window.scrollY;
    state.quick = '';
    groupsEl.hidden = true;
    quickView.hidden = true;
    searchView.hidden = false;
    dirItems.forEach(function (b) { b.classList.remove('active'); b.removeAttribute('aria-current'); });
    favoriteItem.classList.remove('active');
    recentItem.classList.remove('active');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function leaveSearch(restore) {
    clearTimeout(searchTimer);
    lastSearchKey = '';
    searchHits = [];
    searchLimit = SEARCH_PAGE_SIZE;
    state.q = '';
    qEl.value = '';
    unwireIcons(searchGrid);
    searchGrid.innerHTML = '';
    searchGrid.hidden = false;
    searchEmpty.hidden = true;
    searchEmpty.innerHTML = '';
    searchMore.hidden = true;
    searchView.hidden = true;
    groupsEl.hidden = false;
    if (restore) window.scrollTo({ top: state.savedY, behavior: 'auto' });
    updateSpy(true);
  }

  function renderSearch() {
    var hits = searchAll(state.q);
    searchHits = hits;
    /* 结果没变就不重绘，避免宽泛关键词反复重建上百张卡片 */
    var shown = hits.slice(0, searchLimit);
    var key = state.q + '\u0000' + searchLimit + '\u0000' + hits.map(function (h) { return urlKey(h.item.url); }).join('\u0000');
    if (key === lastSearchKey) return;
    lastSearchKey = key;

    searchMeta.textContent = '「' + state.q + '」· 共 ' + hits.length + ' 条，当前显示 ' + shown.length + ' 条';

    if (!hits.length) {
      searchGrid.hidden = true;
      searchMore.hidden = true;
      searchEmpty.hidden = false;
      searchEmpty.innerHTML = '<b>没有找到匹配的站点</b>试试更短的关键词，或直接清空搜索。';
      return;
    }
    searchEmpty.hidden = true;
    searchGrid.hidden = false;
    unwireIcons(searchGrid);
    searchGrid.innerHTML = shown.map(function (h) {
      return cardHTML(h.item, [h.group, h.section]);
    }).join('');
    searchMore.hidden = shown.length >= hits.length;
    searchMore.textContent = '继续显示 ' + Math.min(SEARCH_PAGE_SIZE, hits.length - shown.length) + ' 条';
    wireIcons(searchGrid);
  }

  function runSearch() {
    var v = qEl.value.trim();
    if (v === state.q) return;
    state.q = v;
    if (!v) { leaveSearch(true); return; }
    searchLimit = SEARCH_PAGE_SIZE;
    enterSearch();
    renderSearch();
  }

  searchMore.addEventListener('click', function () {
    searchLimit += SEARCH_PAGE_SIZE;
    lastSearchKey = '';
    renderSearch();
  });

  function openSearchHit(hit) {
    if (!hit || !hit.item) return;
    var item = hit.item;
    recordRecent(urlKey(item.url));
    var a = document.createElement('a');
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* 中文输入法拼写阶段不要搜索，等上屏后再跑 */
  qEl.addEventListener('compositionstart', function () { composing = true; });
  qEl.addEventListener('compositionend', function () {
    composing = false;
    composingEndAt = performance.now();
    clearTimeout(searchTimer);
    runSearch();
  });
  qEl.addEventListener('input', function () {
    if (composing) return;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
  });

  /* ---------- 地址栏 ---------- */
  function syncHash() {
    if (!NAV.length || state.q || state.quick || !sections.length) return;
    var g = NAV[state.active];
    if (!g) return;
    var sec = g.sections[state.tabs[state.active]];
    if (!sec) return;
    var h = '#/' + encodeURIComponent(g.name) + '/' + encodeURIComponent(sec.name);
    if (location.hash === h) return;
    if (canReplace) {
      try { history.replaceState(null, '', h); return; } catch (e) { canReplace = false; }
    }
    skipHash = true;
    location.hash = h;
  }

  function applyHash() {
    if (!NAV.length) return;
    var raw = '';
    try { raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) { return; }
    /* 先读 hash 再清视图：清视图时 updateSpy 会 syncHash 改写地址 */
    if (state.q) leaveSearch(false);
    if (state.quick) leaveQuick(false);
    if (!raw) { goGroup(0, false); return; }
    var parts = raw.split('/');
    var oldGroup = parts[0];
    var oldSection = parts[1] || '';
    var groupAliases = {
      '开发': '前端开发',
      '后端·运维': '后端运维'
    };
    var sectionAliases = {
      'AI/AI 编程': ['AI 生态', 'AI 编程'],
      'AI/AI 开源项目': ['AI 生态', 'AI 编程'],
      'AI/智能体·工作流': ['AI 生态', '智能体·工作流'],
      'AI/MCP 工具': ['AI 生态', 'MCP 工具'],
      'AI/模型·API': ['AI 生态', '大模型'],
      'AI/AI 模型·社区': ['AI 生态', 'AI 模型·社区'],
      'AI/AI 算力': ['AI 生态', 'AI 算力'],
      'AI/提示词·Skills': ['AI 生态', '提示词'],
      'AI/AI 学习': ['AI 生态', 'AI 教程·课程'],
      'AI/AI 资讯': ['AI 生态', 'AI 资讯'],
      'AI/AI 竞赛': ['AI 生态', 'AI 竞赛'],
      'AI/AIGC 博主': ['AI 生态', 'AIGC 博主'],
      'AI/AI 导航': ['AI 生态', 'AI 导航'],
      'AI/AI 图像': ['AI', 'AI 图像生成'],
      'AI/AI 视频': ['AI', 'AI 视频生成'],
      'AI/AI 办公': ['AI', 'AI 文档·表格'],
      '工具/在线工具箱': ['工具', '综合工具箱'],
      '工具/图片处理': ['工具', '图片编辑'],
      '学习/教程文档': ['学习', '编程·技术文档'],
      '学习/综合学习': ['学习', '在线课程'],
      '生活/常用': ['生活', '日常服务'],
      '生活/资讯': ['生活', '新闻资讯'],
      '生活/金融': ['生活', '金融机构'],
      '生活/财经': ['生活', '财经资讯'],
      '娱乐/视频网站': ['娱乐', '视频平台'],
      '娱乐/摸鱼专用': ['娱乐', '趣味网站'],
      '影视/海外剧': ['影视', '港台·其他海外剧'],
      '素材/图片·视频素材': ['素材', '摄影图片'],
      '素材/图片·设计素材': ['素材', '设计素材']
    };
    var mapped = sectionAliases[oldGroup + '/' + oldSection];
    if (mapped) parts = mapped.slice();
    else if (groupAliases[oldGroup]) parts[0] = groupAliases[oldGroup];
    var gi = findIndex(NAV, parts[0]);
    if (gi < 0) { goGroup(0, false); return; }
    var ti = parts[1] ? findIndex(NAV[gi].sections, parts[1]) : 0;
    if (ti < 0) ti = 0;
    selectTab(gi, ti, false);
    goGroup(gi, false);
  }

  window.addEventListener('hashchange', function () {
    if (skipHash) { skipHash = false; return; }
    applyHash();
  });

  /* ---------- 左栏点击 ---------- */
  dirEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.dir-item');
    if (!btn) return;
    if (btn === favoriteItem) { enterQuick('favorites'); return; }
    if (btn === recentItem) { enterQuick('recents'); return; }
    if (state.q) leaveSearch(false);
    if (state.quick) leaveQuick(false);
    goGroup(Number(btn.dataset.g), true);
  });

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    /* 输入法拼写阶段不响应 Enter/Escape/快捷键 */
    if (composing || e.isComposing) return;
    var tag = document.activeElement && document.activeElement.tagName;
    var inInput = /^(INPUT|TEXTAREA|SELECT)$/.test(tag || '');

    if (e.key === 'Enter' && !e.repeat && document.activeElement === qEl) {
      /* 刚结束输入法组合时按 Enter 通常是在上屏，不打开结果 */
      if (composingEndAt && performance.now() - composingEndAt < 80) return;
      e.preventDefault();
      clearTimeout(searchTimer);
      runSearch();
      if (searchHits.length) openSearchHit(searchHits[0]);
      return;
    }
    if (e.key === '/' && !inInput) {
      e.preventDefault();
      qEl.focus();
      qEl.select();
      return;
    }
    if (e.key === 'Escape') {
      if (qEl.value) { leaveSearch(true); return; }
      if (state.quick) { leaveQuick(true); return; }
      qEl.blur();
      return;
    }
    if (!inInput && !state.q && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      var g = NAV[state.active];
      if (!g) return;
      var next = state.tabs[state.active] + (e.key === 'ArrowRight' ? 1 : -1);
      if (next >= 0 && next < g.sections.length) {
        e.preventDefault();
        selectTab(state.active, next, true);
        setActive(state.active);
      }
    }
  });

  /* ---------- 主题 ---------- */
  var themeBtn = document.getElementById('theme');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  function reflectTheme() {
    var dark = root.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? '切换到浅色模式' : '切换到深色模式');
    themeBtn.title = themeBtn.getAttribute('aria-label');
    if (themeMeta) themeMeta.setAttribute('content', dark ? '#14171b' : '#f6f7f9');
  }
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('nav-theme', next); } catch (e) {}
    reflectTheme();
  });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function (ev) {
      var saved = null;
      try { saved = localStorage.getItem('nav-theme'); } catch (e) {}
      if (saved) return;
      root.setAttribute('data-theme', ev.matches ? 'dark' : 'light');
      reflectTheme();
    };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }
  reflectTheme();

  /* ---------- 启动 ---------- */
  document.getElementById('siteName').textContent = SITE.name || '我的导航';
  document.getElementById('siteDesc').textContent = SITE.desc || '';
  document.title = SITE.name || '我的导航';
  var descMeta = document.querySelector('meta[name="description"]');
  if (descMeta) descMeta.setAttribute('content', SITE.desc || '常用站点 · 分类整理');

  if (!NAV.length) {
    groupsEl.innerHTML = '<div class="empty"><b>data.js 里还没有数据</b>照着文件头部的注释填几条就能用了。</div>';
  } else {
    indexItems();
    build();
    if (location.hash && location.hash !== '#/') applyHash();
    else { goGroup(0, false); syncHash(); }
    requestAnimationFrame(markStuck);
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>我的导航</title>
<script>
  /* 先定主题再渲染，避免首屏白闪 */
  (function () {
    try {
      var t = localStorage.getItem('nav-theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
  :root {
    --bg: #f6f7f9;
    --elv: #ffffff;
    --soft: #f0f2f5;
    --border: #e6e8ec;
    --text1: #1b1f24;
    --text2: #6b7480;
    --brand: #0f9d6b;
    --brand-soft: #e9f7f1;
    --brand-text: #0b7d56;
    --mark: rgba(250, 204, 21, .38);
    --shadow: 0 6px 18px rgba(17, 24, 39, .08);
    --radius: 8px;
    --side: 236px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #14171b;
    --elv: #1b1f25;
    --soft: #23282f;
    --border: #2b313a;
    --text1: #e7eaee;
    --text2: #98a2b0;
    --brand: #34d399;
    --brand-soft: rgba(52, 211, 153, .10);
    --brand-text: #6ee7b7;
    --mark: rgba(250, 204, 21, .26);
    --shadow: 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- 外壳 ---------- */
  .app {
    display: grid;
    grid-template-columns: var(--side) minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- 左栏 ---------- */
  .side {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 12px 16px;
    background: var(--elv);
    border-right: 1px solid var(--border);
  }
  .brand { display: flex; align-items: flex-start; gap: 9px; padding: 0 4px; }
  .brand-txt { min-width: 0; flex: 1; }
  .brand-txt b { display: block; font-size: 15px; font-weight: 650; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-txt small { display: block; margin-top: 1px; font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .theme-btn {
    width: 28px; height: 28px; flex: none;
    margin-top: -1px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .theme-btn:hover { background: var(--soft); color: var(--text1); border-color: var(--text2); }
  .theme-btn svg { width: 15px; height: 15px; }
  [data-theme="light"] .i-moon { display: none; }
  [data-theme="dark"] .i-sun { display: none; }

  .search { position: relative; }
  .search svg {
    position: absolute; left: 9px; top: 50%;
    width: 15px; height: 15px;
    transform: translateY(-50%);
    color: var(--text2); pointer-events: none;
  }
  .search input {
    width: 100%; height: 34px;
    padding: 0 30px 0 30px;
    font: inherit; font-size: 13px;
    color: var(--text1);
    background: var(--soft);
    border: 1px solid transparent;
    border-radius: 8px;
    outline: none;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--text2); opacity: .8; }
  .search input:focus {
    background: var(--elv);
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  .search kbd {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    padding: 1px 5px;
    font-family: inherit; font-size: 10px; line-height: 1.4;
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--elv);
    pointer-events: none;
  }
  .search input:focus + kbd { opacity: 0; }

  .dir {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0 -4px;
    padding: 2px 4px;
    scrollbar-width: thin;
  }
  .dir::-webkit-scrollbar { width: 6px; }
  .dir::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .dir::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  .dir-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    padding: 7px 10px;
    background: transparent;
    border: 0;
    border-radius: 7px;
    color: var(--text2);
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .dir-item:hover { background: var(--soft); color: var(--text1); }
  .dir-item .dot {
    width: 5px; height: 5px; flex: none;
    border-radius: 50%;
    background: currentColor;
    opacity: .35;
    transition: opacity .15s, transform .15s;
  }
  .dir-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dir-item .num { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }
  .dir-item.active {
    background: var(--brand-soft);
    color: var(--brand-text);
    font-weight: 600;
    box-shadow: inset 2px 0 0 var(--brand);
  }
  .dir-item.active .dot { opacity: 1; transform: scale(1.35); }
  .search-item { margin-bottom: 4px; }
  .search-item .dot { background: var(--brand); }
  .search-item .num { opacity: .8; }
  .quick-item .dot { background: var(--brand); }

  /* ---------- 主体 ---------- */
  .main { padding: 22px clamp(18px, 3vw, 40px) 80px; min-width: 0; }

  .group { scroll-margin-top: 8px; }
  .group + .group {
    margin-top: 44px;
    padding-top: 26px;
    border-top: 1px solid var(--border);
  }
  .group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .group-head h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.2px;
  }
  .group-head .meta { font-size: 12.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .quick-clear {
    margin-left: auto;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--elv);
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
  }
  .quick-clear:hover { color: var(--text1); border-color: var(--text2); }

  /* tab 条在所属区块内吸顶 */
  .tabbar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin-top: 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    transition: box-shadow .2s;
  }
  .tabbar.stuck { box-shadow: 0 6px 14px -10px rgba(0, 0, 0, .5); }
  .tabs {
    display: flex; gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs.fade-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); }
  .tabs.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
  .tabs.fade-l.fade-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent); }

  .tab {
    position: relative;
    padding: 9px 12px 10px;
    background: transparent;
    border: 0;
    border-radius: 6px 6px 0 0;
    color: var(--text2);
    font-size: 13.5px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  .tab:hover { color: var(--text1); background: var(--soft); }
  .tab[aria-selected="true"] { color: var(--brand-text); font-weight: 600; }
  .tab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 10px; right: 10px; bottom: -1px;
    height: 2px;
    border-radius: 2px;
    background: var(--brand);
  }
  .tab .n { font-size: 10.5px; opacity: .55; margin-left: 5px; font-variant-numeric: tabular-nums; }

  /* ---------- 卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  @media (min-width: 1440px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  }

  .card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 92px;
    padding: 10px 12px 9px;
    background: var(--elv);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    transition: background .2s, border-color .2s, box-shadow .2s, transform .2s;
  }
  .card-shell { position: relative; min-width: 0; }
  .card-shell .card { height: 100%; padding-right: 42px; }
  .fav-btn {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px;
    display: grid; place-items: center;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text2);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }
  .fav-btn:hover { color: var(--brand-text); background: var(--soft); }
  .fav-btn[aria-pressed="true"] { color: #e6a700; }
  .fav-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .card:hover {
    background: var(--brand-soft);
    border-color: var(--brand);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .card:active { transform: translateY(0); }
  .card:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .card-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ico {
    width: 34px; height: 34px; flex: none;
    display: grid; place-items: center;
    border-radius: 6px;
    background: var(--soft);
    overflow: hidden;
  }
  .ico img { width: 22px; height: 22px; object-fit: contain; border-radius: 3px; }
  .ico .letter {
    display: none;
    align-items: center; justify-content: center;
    width: 100%; height: 100%;
    font-size: 15px; font-weight: 700;
    color: hsl(var(--h, 160) 45% 32%);
    background: hsl(var(--h, 160) 65% 90%);
  }
  [data-theme="dark"] .ico .letter {
    color: hsl(var(--h, 160) 60% 80%);
    background: hsl(var(--h, 160) 30% 26%);
  }

  .card-title {
    flex: 1; min-width: 0;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card:hover .card-title { color: var(--brand-text); }

  .card-desc {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.55;
    color: var(--text2);
    display: -webkit-box;
    line-clamp: 2;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-path {
    margin-top: 6px;
    display: flex; align-items: center; gap: 5px;
    font-size: 11px;
    color: var(--text2);
    opacity: .9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-path i { font-style: normal; opacity: .5; }

  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  .empty {
    margin: 40px 0;
    text-align: center;
    color: var(--text2);
    font-size: 13px;
  }
  .empty b { display: block; font-size: 15px; color: var(--text1); margin-bottom: 4px; font-weight: 600; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side, .main { min-width: 0; }
    .side {
      position: sticky;
      top: 0;
      z-index: 20;
      height: auto;
      gap: 9px;
      padding: 10px 12px 6px;
      border-right: 0;
      border-bottom: 1px solid var(--border);
    }
    .dir {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 6px;
      margin: 0;
      padding: 2px 0 4px;
    }
    .dir::-webkit-scrollbar { display: none; }
    .dir-item {
      width: auto;
      padding: 6px 12px;
      background: var(--soft);
      border-radius: 999px;
    }
    .dir-item.active { box-shadow: none; }
    .dir-item .dot { display: none; }
    .dir-item .num { display: none; }
    .search-item { margin-bottom: 0; }
    .main { padding: 16px 14px 56px; }
    .group + .group { margin-top: 34px; padding-top: 20px; }
    .group-head h2 { font-size: 18px; }
    .tabbar { position: static; margin-top: 6px; }
    .tabbar.stuck { box-shadow: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
    .card { min-height: 84px; padding: 9px 10px 8px; }
    .ico { width: 30px; height: 30px; }
    .ico img { width: 20px; height: 20px; }
    .card-title { font-size: 13.5px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-txt">
        <b id="siteName">我的导航</b>
        <small id="siteDesc"></small>
      </span>
      <button class="theme-btn" id="theme" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="search" placeholder="搜索站点、描述、域名" autocomplete="off" spellcheck="false" aria-label="搜索站点">
      <kbd>/</kbd>
    </div>

    <nav class="dir" id="dir" aria-label="分类目录">
      <button class="dir-item quick-item" id="favoriteItem" type="button">
        <span class="dot"></span>
        <span class="name">常用收藏</span>
        <span class="num" id="favoriteNum">0</span>
      </button>
      <button class="dir-item quick-item" id="recentItem" type="button">
        <span class="dot"></span>
        <span class="name">最近访问</span>
        <span class="num" id="recentNum">0</span>
      </button>
      <button class="dir-item search-item" id="searchItem" type="button" hidden>
        <span class="dot"></span>
        <span class="name">搜索结果</span>
        <span class="num" id="searchNum">0</span>
      </button>
    </nav>
  </aside>

  <main class="main" id="main">
    <div id="groups"></div>

    <div id="searchView" hidden>
      <div class="group-head">
        <h2>搜索结果</h2>
        <span class="meta" id="searchMeta"></span>
      </div>
      <div class="grid" id="searchGrid"></div>
      <div class="empty" id="searchEmpty" hidden></div>
    </div>

    <div id="quickView" hidden>
      <div class="group-head">
        <h2 id="quickTitle"></h2>
        <span class="meta" id="quickMeta"></span>
        <button class="quick-clear" id="quickClear" type="button">清空</button>
      </div>
      <div class="grid" id="quickGrid"></div>
      <div class="empty" id="quickEmpty" hidden></div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  /* 图标只把域名交给第三方；失败后尝试站点 favicon，再回退成首字母色块 */
  var ICON_PROVIDER = 'https://ico.n3v.cn/get.php?url=';

  var root = document.documentElement;
  var NAV = window.NAV || [];
  var SITE = window.SITE || {};
  var dirEl = document.getElementById('dir');
  var groupsEl = document.getElementById('groups');
  var searchView = document.getElementById('searchView');
  var searchGrid = document.getElementById('searchGrid');
  var searchMeta = document.getElementById('searchMeta');
  var searchEmpty = document.getElementById('searchEmpty');
  var searchItem = document.getElementById('searchItem');
  var searchNum = document.getElementById('searchNum');
  var favoriteItem = document.getElementById('favoriteItem');
  var favoriteNum = document.getElementById('favoriteNum');
  var recentItem = document.getElementById('recentItem');
  var recentNum = document.getElementById('recentNum');
  var quickView = document.getElementById('quickView');
  var quickTitle = document.getElementById('quickTitle');
  var quickMeta = document.getElementById('quickMeta');
  var quickGrid = document.getElementById('quickGrid');
  var quickEmpty = document.getElementById('quickEmpty');
  var quickClear = document.getElementById('quickClear');
  var qEl = document.getElementById('q');

  var state = { active: 0, tabs: [], q: '', quick: '', savedY: 0 };
  var dirItems = [];
  var sections = [];
  var tabBtns = [];
  var grids = [];
  var tabbars = [];
  var spyLockUntil = 0;
  var spyTimer = 0;
  var skipHash = false;
  var canReplace = true;
  var STORE_FAVORITES = 'nav-favorites';
  var STORE_RECENTS = 'nav-recents';
  var favorites = loadList(STORE_FAVORITES);
  var recents = loadList(STORE_RECENTS);
  var catalog = {};

  try { history.replaceState(null, '', location.href); } catch (e) { canReplace = false; }

  /* ---------- 工具函数 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function hl(text, q) {
    var s = String(text == null ? '' : text);
    if (!q) return esc(s);
    var terms = searchTerms(q);
    var ranges = [];
    var lower = s.toLowerCase();
    terms.forEach(function (term) {
      var start = 0, i;
      while ((i = lower.indexOf(term, start)) >= 0) {
        ranges.push([i, i + term.length]);
        start = i + term.length;
      }
    });
    if (!ranges.length) return esc(s);
    ranges.sort(function (a, b) { return a[0] - b[0] || b[1] - a[1]; });
    var merged = [];
    ranges.forEach(function (range) {
      var last = merged[merged.length - 1];
      if (last && range[0] <= last[1]) last[1] = Math.max(last[1], range[1]);
      else merged.push(range.slice());
    });
    var html = '', pos = 0;
    merged.forEach(function (range) {
      html += esc(s.slice(pos, range[0])) + '<mark>' + esc(s.slice(range[0], range[1])) + '</mark>';
      pos = range[1];
    });
    return html + esc(s.slice(pos));
  }
  function searchTerms(q) {
    var seen = {};
    return String(q || '').toLowerCase().trim().split(/\s+/).filter(function (term) {
      if (!term || seen[term]) return false;
      seen[term] = true;
      return true;
    });
  }
  function firstChar(name) {
    var arr = Array.from(String(name || '').trim());
    return arr.length ? arr[0].toUpperCase() : '·';
  }
  function hue(name) {
    var h = 0, s = String(name || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function domain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }
  function urlKey(url) {
    try {
      var u = new URL(url);
      u.hash = '';
      return u.href.replace(/\/$/, '');
    } catch (e) { return String(url || '').replace(/\/$/, ''); }
  }
  function loadList(key) {
    try {
      var value = JSON.parse(localStorage.getItem(key) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (e) { return []; }
  }
  function saveList(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function siteFavicon(item) {
    try { return new URL('/favicon.ico', item.url).href; } catch (e) { return ''; }
  }
  function iconSrc(item) {
    if (item.icon) return item.icon;
    if (ICON_PROVIDER) return ICON_PROVIDER + encodeURIComponent(domain(item.url));
    return siteFavicon(item);
  }
  function totalOf(g) {
    return g.sections.reduce(function (n, s) { return n + s.items.length; }, 0);
  }
  function findIndex(list, name) {
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return i;
    return -1;
  }
  function indexItems() {
    NAV.forEach(function (g) {
      g.sections.forEach(function (s) {
        s.items.forEach(function (item) {
          catalog[urlKey(item.url)] = { item: item, group: g.name, section: s.name };
        });
      });
    });
    favorites = favorites.filter(function (key) { return !!catalog[key]; });
    recents = recents.filter(function (key) { return !!catalog[key]; }).slice(0, 20);
    saveList(STORE_FAVORITES, favorites);
    saveList(STORE_RECENTS, recents);
    updateQuickCounts();
  }
  function isFavorite(item) { return favorites.indexOf(urlKey(item.url)) >= 0; }
  function updateQuickCounts() {
    favoriteNum.textContent = favorites.length;
    recentNum.textContent = recents.length;
  }
  function refreshCards() {
    updateQuickCounts();
    if (state.quick) renderQuick();
    else if (state.q) renderSearch();
    else NAV.forEach(function (g, gi) { renderGrid(gi); });
  }
  function toggleFavorite(key) {
    var i = favorites.indexOf(key);
    if (i >= 0) favorites.splice(i, 1);
    else if (catalog[key]) favorites.unshift(key);
    saveList(STORE_FAVORITES, favorites);
    refreshCards();
  }
  function recordRecent(key) {
    if (!catalog[key]) return;
    recents = recents.filter(function (value) { return value !== key; });
    recents.unshift(key);
    recents = recents.slice(0, 20);
    saveList(STORE_RECENTS, recents);
    updateQuickCounts();
  }

  /* ---------- 卡片 ---------- */
  function cardHTML(item, path) {
    var desc = item.desc ? '<p class="card-desc">' + hl(item.desc, state.q) + '</p>' : '';
    var meta = path ? '<div class="card-path">' + esc(path[0]) + '<i>/</i>' + esc(path[1]) + '</div>' : '';
    var key = urlKey(item.url);
    var fallback = siteFavicon(item);
    var onerror = fallback
      ? "if(!this.dataset.fallback){this.dataset.fallback='1';this.src='" + esc(fallback) + "'}else{this.style.display='none';this.nextElementSibling.style.display='flex'}"
      : "this.style.display='none';this.nextElementSibling.style.display='flex'";
    return '<div class="card-shell">'
      + '<a class="card" data-url="' + esc(key) + '" href="' + esc(item.url) + '" target="_blank" rel="noreferrer noopener"'
      + ' title="' + esc(item.name + (item.desc ? ' · ' + item.desc : '')) + '">'
      + '<span class="card-head">'
      + '<span class="ico"><img src="' + esc(iconSrc(item)) + '" alt="" loading="lazy" decoding="async"'
      + ' onerror="' + onerror + '">'
      + '<span class="letter" style="--h:' + hue(item.name) + '">' + esc(firstChar(item.name)) + '</span></span>'
      + '<span class="card-title">' + hl(item.name, state.q) + '</span>'
      + '</span>'
      + desc + meta
      + '</a>'
      + '<button class="fav-btn" type="button" data-url="' + esc(key) + '" aria-label="'
      + (isFavorite(item) ? '取消收藏 ' : '收藏 ') + esc(item.name) + '" aria-pressed="' + isFavorite(item) + '" title="收藏">'
      + (isFavorite(item) ? '★' : '☆') + '</button>'
      + '</div>';
  }

  /* ---------- 构建整页 ---------- */
  function groupHTML(g, gi) {
    var total = totalOf(g);
    var tabs = g.sections.map(function (s, ti) {
      return '<button class="tab" type="button" role="tab" data-g="' + gi + '" data-t="' + ti + '"'
        + ' aria-selected="' + (ti === 0) + '">'
        + esc(s.name) + '<span class="n">' + s.items.length + '</span></button>';
    }).join('');
    return '<section class="group" id="g' + gi + '" data-g="' + gi + '">'
      + '<div class="group-head">'
      + '<h2>' + esc(g.name) + '</h2>'
      + '<span class="meta">' + g.sections.length + ' 个分类 · ' + total + ' 个站点</span>'
      + '</div>'
      + '<div class="tabbar"><div class="tabs" role="tablist" aria-label="' + esc(g.name) + '">' + tabs + '</div></div>'
      + '<div class="grid"></div>'
      + '<div class="empty" hidden></div>'
      + '</section>';
  }

  function build() {
    groupsEl.innerHTML = NAV.map(groupHTML).join('');
    sections = Array.prototype.slice.call(groupsEl.querySelectorAll('.group'));
    tabBtns = sections.map(function (sec) {
      return Array.prototype.slice.call(sec.querySelectorAll('.tab'));
    });
    grids = sections.map(function (sec) { return sec.querySelector('.grid'); });
    tabbars = sections.map(function (sec) { return sec.querySelector('.tabbar'); });
    state.tabs = NAV.map(function () { return 0; });

    NAV.forEach(function (g, gi) { renderGrid(gi); });
    renderDir();
    sections.forEach(function (sec, gi) { observeTabs(gi); });
    updateFadeAll();
  }

  function quickEntries(kind) {
    var keys = kind === 'favorites' ? favorites : recents;
    return keys.map(function (key) { return catalog[key]; }).filter(Boolean);
  }

  function renderQuick() {
    var entries = quickEntries(state.quick);
    var favoritesView = state.quick === 'favorites';
    quickTitle.textContent = favoritesView ? '常用收藏' : '最近访问';
    quickMeta.textContent = entries.length + ' 个站点';
    quickClear.hidden = !entries.length;
    quickGrid.hidden = !entries.length;
    quickEmpty.hidden = !!entries.length;
    if (!entries.length) {
      quickGrid.innerHTML = '';
      quickEmpty.innerHTML = favoritesView
        ? '<b>还没有收藏</b>点卡片右上角的星标，就会出现在这里。'
        : '<b>还没有访问记录</b>从任意卡片打开站点后，这里会保留最近 20 条。';
      return;
    }
    quickGrid.innerHTML = entries.map(function (entry) {
      return cardHTML(entry.item, [entry.group, entry.section]);
    }).join('');
  }

  function enterQuick(kind) {
    if (!state.q && !state.quick) state.savedY = window.scrollY;
    state.q = '';
    qEl.value = '';
    state.quick = kind;
    groupsEl.hidden = true;
    searchView.hidden = true;
    searchItem.hidden = true;
    quickView.hidden = false;
    dirItems.forEach(function (b) { b.classList.remove('active'); b.removeAttribute('aria-current'); });
    favoriteItem.classList.toggle('active', kind === 'favorites');
    recentItem.classList.toggle('active', kind === 'recents');
    renderQuick();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function leaveQuick(restore) {
    state.quick = '';
    quickView.hidden = true;
    groupsEl.hidden = false;
    favoriteItem.classList.remove('active');
    recentItem.classList.remove('active');
    if (restore) window.scrollTo({ top: state.savedY, behavior: 'auto' });
    updateSpy(true);
  }

  function renderGrid(gi) {
    var g = NAV[gi];
    var ti = state.tabs[gi];
    var sec = g.sections[ti];
    var grid = grids[gi];
    var empty = sections[gi].querySelector('.empty');

    if (!sec || !sec.items.length) {
      grid.hidden = true;
      grid.innerHTML = '';
      empty.hidden = false;
      empty.innerHTML = '<b>这个 tab 还是空的</b>去 data.js 里给它加几条链接吧。';
      return;
    }
    empty.hidden = true;
    grid.hidden = false;
    grid.innerHTML = sec.items.map(function (it) { return cardHTML(it, null); }).join('');
  }

  function renderDir() {
    var html = NAV.map(function (g, i) {
      return '<button class="dir-item" type="button" data-g="' + i + '">'
        + '<span class="dot"></span>'
        + '<span class="name">' + esc(g.name) + '</span>'
        + '<span class="num">' + totalOf(g) + '</span>'
        + '</button>';
    }).join('');
    dirEl.insertAdjacentHTML('beforeend', html);
    dirItems = Array.prototype.slice.call(dirEl.querySelectorAll('.dir-item[data-g]'));
    setActive(0);
  }

  /* ---------- 左栏高亮 / 滚动联动 ---------- */
  function setActive(i) {
    if (state.q || state.quick) return;
    state.active = i;
    dirItems.forEach(function (b, j) {
      var on = j === i;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });
    searchItem.classList.remove('active');
  }

  /* 窄屏时顶部横条是吸顶的，锚点要避开它 */
  function headerH() {
    if (window.innerWidth >= 900) return 0;
    var side = document.querySelector('.side');
    return side ? side.offsetHeight : 0;
  }

  function updateSpy(force) {
    if (!sections.length || state.q || state.quick) return;
    if (!force && performance.now() < spyLockUntil) {
      /* 平滑滚动期间先锁住高亮，等滚完再补一次 */
      if (!spyTimer) {
        spyTimer = setTimeout(function () { spyTimer = 0; updateSpy(); }, Math.ceil(spyLockUntil - performance.now()) + 30);
      }
      return;
    }

    var h = headerH();
    var idx = 0;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getBoundingClientRect().top - h - 12 <= 0) idx = i;
    }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) {
      idx = sections.length - 1;
    }
    if (idx !== state.active) setActive(idx);
    if (canReplace) syncHash();
    markStuck();
  }

  function markStuck() {
    var h = headerH();
    for (var i = 0; i < tabbars.length; i++) {
      var bar = tabbars[i];
      var r = sections[i].getBoundingClientRect();
      bar.classList.toggle('stuck', r.top <= h + 1 && r.bottom > h + bar.offsetHeight + 10);
    }
  }

  function scrollToGroup(gi, smooth) {
    var sec = sections[gi];
    if (!sec) return;
    var target = sec.getBoundingClientRect().top + window.scrollY - headerH() - 8;
    if (target < 40) target = 0;
    window.scrollTo({ top: target, behavior: smooth ? 'smooth' : 'auto' });
  }

  function goGroup(i, smooth) {
    if (!sections[i]) return;
    scrollToGroup(i, smooth);
    setActive(i);
    spyLockUntil = performance.now() + 700;
    syncHash();
  }

  /* ---------- 切换 tab ---------- */
  function selectTab(gi, ti, keepPosition) {
    var g = NAV[gi];
    if (!g || !g.sections[ti]) return;
    state.tabs[gi] = ti;
    tabBtns[gi].forEach(function (b, i) {
      b.setAttribute('aria-selected', i === ti ? 'true' : 'false');
    });
    renderGrid(gi);
    scrollTabIntoView(gi);

    if (!keepPosition) return;
    /* 内容高度变了，把区块顶回视口顶部，避免页面乱跳 */
    var rect = sections[gi].getBoundingClientRect();
    if (rect.top < headerH() - 4) {
      scrollToGroup(gi, true);
      spyLockUntil = performance.now() + 500;
    }
    syncHash();
    updateFadeAll();
  }

  function scrollTabIntoView(gi) {
    var btn = tabBtns[gi][state.tabs[gi]];
    var wrap = tabBtns[gi][0] ? tabBtns[gi][0].parentNode : null;
    if (!btn || !wrap) return;
    var left = btn.offsetLeft;
    var right = left + btn.offsetWidth;
    if (left < wrap.scrollLeft || right > wrap.scrollLeft + wrap.clientWidth) {
      var target = left - (wrap.clientWidth - btn.offsetWidth) / 2;
      wrap.scrollLeft = Math.max(0, target);
    }
    updateFade(wrap);
  }

  function updateFade(wrap) {
    var max = wrap.scrollWidth - wrap.clientWidth;
    wrap.classList.toggle('fade-l', wrap.scrollLeft > 2);
    wrap.classList.toggle('fade-r', max > 2 && wrap.scrollLeft < max - 2);
  }
  function updateFadeAll() {
    tabBtns.forEach(function (btns) {
      if (btns[0]) updateFade(btns[0].parentNode);
    });
  }

  function observeTabs(gi) {
    var wrap = tabBtns[gi][0] && tabBtns[gi][0].parentNode;
    if (!wrap) return;
    wrap.addEventListener('scroll', function () { updateFade(wrap); }, { passive: true });
  }

  groupsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    var gi = Number(btn.dataset.g);
    var ti = Number(btn.dataset.t);
    setActive(gi);
    selectTab(gi, ti, true);
    spyLockUntil = performance.now() + 600;
    syncHash();
  });

  document.getElementById('main').addEventListener('click', function (e) {
    var favorite = e.target.closest('.fav-btn');
    if (favorite) {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(favorite.dataset.url);
      return;
    }
    var card = e.target.closest('.card[data-url]');
    if (card) recordRecent(card.dataset.url);
  });

  quickClear.addEventListener('click', function () {
    if (state.quick === 'favorites') {
      favorites = [];
      saveList(STORE_FAVORITES, favorites);
    } else if (state.quick === 'recents') {
      recents = [];
      saveList(STORE_RECENTS, recents);
    }
    updateQuickCounts();
    renderQuick();
  });

  /* ---------- 滚动监听 ---------- */
  var lastSpy = 0;
  window.addEventListener('scroll', function () {
    var now = performance.now();
    if (now - lastSpy < 40) return;
    lastSpy = now;
    updateSpy();
  }, { passive: true });

  window.addEventListener('resize', function () {
    updateFadeAll();
    markStuck();
  });

  /* ---------- 搜索 ---------- */
  function searchAll(q) {
    var terms = searchTerms(q), out = [];
    if (!terms.length) return out;
    for (var i = 0; i < NAV.length; i++) {
      var g = NAV[i];
      for (var j = 0; j < g.sections.length; j++) {
        var s = g.sections[j];
        for (var n = 0; n < s.items.length; n++) {
          var it = s.items[n];
          var name = it.name.toLowerCase();
          var desc = (it.desc || '').toLowerCase();
          var keywords = (it.keywords || '').toLowerCase();
          var url = (it.url || '').toLowerCase();
          var group = g.name.toLowerCase();
          var section = s.name.toLowerCase();
          var score = 0, matched = true;
          for (var t = 0; t < terms.length; t++) {
            var k = terms[t], termScore = 0;
            if (name === k) termScore = 12;
            else if (name.indexOf(k) === 0) termScore = 10;
            else if (name.indexOf(k) >= 0) termScore = 8;
            else if (keywords.indexOf(k) >= 0) termScore = 7;
            else if (section.indexOf(k) >= 0) termScore = 5;
            else if (group.indexOf(k) >= 0) termScore = 4;
            else if (url.indexOf(k) >= 0) termScore = 3;
            else if (desc.indexOf(k) >= 0) termScore = 2;
            if (!termScore) { matched = false; break; }
            score += termScore;
          }
          if (matched) out.push({ item: it, group: g.name, section: s.name, score: score });
        }
      }
    }
    out.sort(function (a, b) { return b.score - a.score || a.item.name.localeCompare(b.item.name, 'zh-CN'); });
    return out;
  }

  function enterSearch() {
    if (!searchView.hidden) return;
    if (!state.quick) state.savedY = window.scrollY;
    state.quick = '';
    groupsEl.hidden = true;
    quickView.hidden = true;
    searchView.hidden = false;
    searchItem.hidden = false;
    dirItems.forEach(function (b) { b.classList.remove('active'); b.removeAttribute('aria-current'); });
    searchItem.classList.add('active');
    favoriteItem.classList.remove('active');
    recentItem.classList.remove('active');
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function leaveSearch(restore) {
    state.q = '';
    qEl.value = '';
    searchView.hidden = true;
    groupsEl.hidden = false;
    searchItem.hidden = true;
    searchItem.classList.remove('active');
    if (restore) window.scrollTo({ top: state.savedY, behavior: 'auto' });
    updateSpy(true);
  }

  function renderSearch() {
    var hits = searchAll(state.q);
    searchNum.textContent = hits.length;
    searchMeta.textContent = '「' + state.q + '」· ' + hits.length + ' 个匹配';

    if (!hits.length) {
      searchGrid.hidden = true;
      searchEmpty.hidden = false;
      searchEmpty.innerHTML = '<b>没有找到匹配的站点</b>试试更短的关键词，或直接清空搜索。';
      return;
    }
    searchEmpty.hidden = true;
    searchGrid.hidden = false;
    searchGrid.innerHTML = hits.map(function (h) {
      return cardHTML(h.item, [h.group, h.section]);
    }).join('');
  }

  qEl.addEventListener('input', function () {
    var v = qEl.value.trim();
    if (v === state.q) return;
    state.q = v;
    if (!v) { leaveSearch(true); return; }
    enterSearch();
    renderSearch();
  });

  /* ---------- 地址栏 ---------- */
  function syncHash() {
    if (!NAV.length || state.q || state.quick || !sections.length) return;
    var g = NAV[state.active];
    if (!g) return;
    var sec = g.sections[state.tabs[state.active]];
    if (!sec) return;
    var h = '#/' + encodeURIComponent(g.name) + '/' + encodeURIComponent(sec.name);
    if (location.hash === h) return;
    if (canReplace) {
      try { history.replaceState(null, '', h); return; } catch (e) { canReplace = false; }
    }
    skipHash = true;
    location.hash = h;
  }

  function applyHash() {
    if (!NAV.length) return;
    if (state.quick) leaveQuick(false);
    var raw = '';
    try { raw = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) { return; }
    if (!raw) { goGroup(0, false); return; }
    var parts = raw.split('/');
    var gi = findIndex(NAV, parts[0]);
    if (gi < 0) { goGroup(0, false); return; }
    var ti = parts[1] ? findIndex(NAV[gi].sections, parts[1]) : 0;
    if (ti < 0) ti = 0;
    selectTab(gi, ti, false);
    goGroup(gi, false);
  }

  window.addEventListener('hashchange', function () {
    if (skipHash) { skipHash = false; return; }
    applyHash();
  });

  /* ---------- 左栏点击 ---------- */
  dirEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.dir-item');
    if (!btn) return;
    if (btn === searchItem) return;
    if (btn === favoriteItem) { enterQuick('favorites'); return; }
    if (btn === recentItem) { enterQuick('recents'); return; }
    if (state.q) leaveSearch(false);
    if (state.quick) leaveQuick(false);
    goGroup(Number(btn.dataset.g), true);
  });

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    var inInput = /^(INPUT|TEXTAREA|SELECT)$/.test(tag || '');

    if (e.key === '/' && !inInput) {
      e.preventDefault();
      qEl.focus();
      qEl.select();
      return;
    }
    if (e.key === 'Escape') {
      if (qEl.value) { leaveSearch(true); return; }
      if (state.quick) { leaveQuick(true); return; }
      qEl.blur();
      return;
    }
    if (!inInput && !state.q && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      var g = NAV[state.active];
      if (!g) return;
      var next = state.tabs[state.active] + (e.key === 'ArrowRight' ? 1 : -1);
      if (next >= 0 && next < g.sections.length) {
        e.preventDefault();
        selectTab(state.active, next, true);
        setActive(state.active);
      }
    }
  });

  /* ---------- 主题 ---------- */
  var themeBtn = document.getElementById('theme');
  function reflectTheme() {
    var dark = root.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? '切换到浅色模式' : '切换到深色模式');
    themeBtn.title = themeBtn.getAttribute('aria-label');
  }
  themeBtn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('nav-theme', next); } catch (e) {}
    reflectTheme();
  });
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function (ev) {
      var saved = null;
      try { saved = localStorage.getItem('nav-theme'); } catch (e) {}
      if (saved) return;
      root.setAttribute('data-theme', ev.matches ? 'dark' : 'light');
      reflectTheme();
    };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }
  reflectTheme();

  /* ---------- 启动 ---------- */
  document.getElementById('siteName').textContent = SITE.name || '我的导航';
  document.getElementById('siteDesc').textContent = SITE.desc || '';
  document.title = SITE.name || '我的导航';

  if (!NAV.length) {
    groupsEl.innerHTML = '<div class="empty"><b>data.js 里还没有数据</b>照着文件头部的注释填几条就能用了。</div>';
  } else {
    indexItems();
    build();
    if (location.hash && location.hash !== '#/') applyHash();
    else { goGroup(0, false); syncHash(); }
    requestAnimationFrame(markStuck);
  }
})();
</script>
</body>
</html>
